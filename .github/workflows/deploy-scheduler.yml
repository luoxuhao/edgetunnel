name: Deploy update scheduler

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'automation/scheduler/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: edgetunnel-scheduler-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_SCHEDULER_PAT: ${{ secrets.GITHUB_SCHEDULER_PAT }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required settings
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_PROJECT:-}" ]] || { echo "::error::CF_PAGES_PROJECT is missing."; exit 1; }
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or invalid."; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          [[ -n "${GITHUB_SCHEDULER_PAT:-}" ]] || { echo "::error::GITHUB_SCHEDULER_PAT is missing."; exit 1; }

      - name: Verify Cloudflare Pages access
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cf-project.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          if [[ "$code" != "200" ]] || ! grep -q '"success":true' /tmp/cf-project.json; then
            echo "::error::Cannot access Cloudflare Pages project '$CF_PROJECT' (HTTP $code)."
            exit 1
          fi
          echo "✓ Cloudflare Pages project is accessible"

      - name: Verify GitHub scheduler PAT
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/gh-workflow.json -w '%{http_code}'             -H "Authorization: Bearer $GITHUB_SCHEDULER_PAT"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/luoxuhao/edgetunnel/actions/workflows/sync.yml")
          if [[ "$code" != "200" ]]; then
            echo "::error::GitHub PAT cannot access sync.yml (HTTP $code). Grant Actions: Read and write to luoxuhao/edgetunnel."
            exit 1
          fi
          echo "✓ GitHub scheduler PAT can access sync.yml"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run automation tests
        run: node --test automation/update.test.mjs

      - name: Disable competing Pages Git deployments
        shell: bash
        run: |
          set -euo pipefail
          body='{"source":{"type":"github","config":{"production_deployments_enabled":false,"preview_deployment_setting":"none"}}}'
          code=$(curl -sS -o /tmp/cf-edit.json -w '%{http_code}'             -X PATCH             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "$body"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          if [[ "$code" != "200" ]] || ! grep -q '"success":true' /tmp/cf-edit.json; then
            echo "::error::Could not disable Pages Git auto-deployments (HTTP $code)."
            cat /tmp/cf-edit.json
            exit 1
          fi
          echo "✓ Disabled automatic production and preview deployments from the Pages Git integration"

      - name: Deploy scheduler Worker and Cron trigger
        run: npx --yes wrangler@4.135.0 deploy --config automation/scheduler/wrangler.toml

      - name: Configure GitHub token in scheduler Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SCHEDULER_PAT" |
            npx --yes wrangler@4.135.0 secret put GITHUB_TOKEN --config automation/scheduler/wrangler.toml

      - name: Trigger first sync and Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/luoxuhao/edgetunnel/actions/workflows/sync.yml/dispatches"             -d '{"ref":"main","inputs":{"force_deploy":"true"}}'
          echo "✓ Initial sync workflow dispatched"

      - name: Summary
        run: |
          echo "## Unattended updater bootstrap complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages Git production/preview auto-deployments: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduler Worker: edgetunnel-update-scheduler" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cron: 17 */6 * * * (UTC)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduler secret: configured" >> "$GITHUB_STEP_SUMMARY"
          echo "- Initial Sync and deploy Pages workflow: dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "- Future scheduler changes redeploy automatically on push." >> "$GITHUB_STEP_SUMMARY"
