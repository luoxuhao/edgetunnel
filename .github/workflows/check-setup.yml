name: Check unattended update setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_SCHEDULER_PAT: ${{ secrets.GITHUB_SCHEDULER_PAT }}

    steps:
      - name: Validate required settings
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [[ -z "${!1:-}" ]]; then
              echo "::error::$1 is missing"
              missing=1
            else
              echo "✓ $1 is configured"
            fi
          }
          check CF_PROJECT
          check CLOUDFLARE_ACCOUNT_ID
          check CLOUDFLARE_API_TOKEN
          check GITHUB_SCHEDULER_PAT
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 hexadecimal characters"; missing=1; }
          exit "$missing"

      - name: Verify Cloudflare Pages access
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cf.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          if [[ "$code" != "200" ]] || ! grep -q '"success":true' /tmp/cf.json; then
            echo "::error::Cannot access Cloudflare Pages project '$CF_PROJECT' (HTTP $code). Check project name, account ID and token permissions."
            exit 1
          fi
          echo "✓ Cloudflare Pages project is accessible"

      - name: Verify GitHub scheduler PAT
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/gh.json -w '%{http_code}'             -H "Authorization: Bearer $GITHUB_SCHEDULER_PAT"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/luoxuhao/edgetunnel/actions/workflows/sync.yml")
          if [[ "$code" != "200" ]]; then
            echo "::error::GitHub PAT cannot read sync.yml (HTTP $code). Grant Actions: Read and write to luoxuhao/edgetunnel."
            exit 1
          fi
          echo "✓ GitHub scheduler PAT can access sync.yml"

      - name: Run automation unit tests
        uses: actions/checkout@v6

      - name: Test updater and scheduler logic
        run: node --test automation/update.test.mjs

      - name: Summary
        run: |
          echo "## Setup check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub secrets/variables, Cloudflare Pages access, GitHub PAT access, and local automation tests are all valid." >> "$GITHUB_STEP_SUMMARY"
