name: Keep scheduled workflows active

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 1,15 * *'

permissions:
  contents: write

concurrency:
  group: edgetunnel-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Record repository activity
        shell: bash
        run: |
          set -euo pipefail

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive

          if git diff --cached --quiet; then
            echo "Nothing to update."
            exit 0
          fi

          git commit -m "[CF-Pages-Skip] Keep scheduled workflows active"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "## Keepalive complete" >> "$GITHUB_STEP_SUMMARY"
          echo "A small repository-activity commit was created with the [CF-Pages-Skip] prefix so Cloudflare Pages will skip this deployment." >> "$GITHUB_STEP_SUMMARY"
