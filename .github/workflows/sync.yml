name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: edgetunnel-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch latest upstream files
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/cmliu/edgetunnel/commits/main"
          UPSTREAM_SHA="$(curl --fail --silent --show-error --retry 3             -H 'Accept: application/vnd.github+json'             "$API" | jq -r '.sha')"

          if [[ ! "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid upstream commit SHA: $UPSTREAM_SHA"
            exit 1
          fi

          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $UPSTREAM_SHA"

          for file in _worker.js LICENSE CHANGELOG; do
            url="https://raw.githubusercontent.com/cmliu/edgetunnel/$UPSTREAM_SHA/$file"
            curl --fail --location --silent --show-error --retry 3               "$url" -o "$file.new"

            if [[ ! -s "$file.new" ]]; then
              echo "::error::Downloaded file is empty: $file"
              exit 1
            fi

            mv "$file.new" "$file"
          done

          node --check _worker.js

      - name: Commit upstream changes
        shell: bash
        run: |
          set -euo pipefail

          git add -- _worker.js LICENSE CHANGELOG

          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="${{ steps.upstream.outputs.sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"

          git commit -m "Update edgetunnel from $SHORT_SHA"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "## Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: cmliu/edgetunnel main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ steps.upstream.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Files watched: _worker.js, LICENSE, CHANGELOG" >> "$GITHUB_STEP_SUMMARY"
          echo "- If files changed, the push to main lets Cloudflare Pages Git integration deploy automatically." >> "$GITHUB_STEP_SUMMARY"
