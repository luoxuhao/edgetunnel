name: Sync and deploy Pages

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Redeploy even when the source has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: edgetunnel-production
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORCE_DEPLOY: ${{ inputs.force_deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test update logic
        run: node --test automation/update.test.mjs
      - name: Validate configuration, synchronize and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/update.mjs
      - name: Failure summary
        if: failure()
        run: |
          echo 'Update failed. The scheduler retries on its next run. Check the failing step; no successful deployment state is recorded before Pages reports success.' >> "$GITHUB_STEP_SUMMARY"
